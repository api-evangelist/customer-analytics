aid: customer-analytics
name: Customer Analytics
description: 'Customer Analytics (CA) is a data, analytics and AI consultancy headquartered in Middleton,
  Wisconsin with a delivery centre in Guindy, Chennai, India. The firm delivers AI/ML and data analytics,
  data engineering, business intelligence and reporting, business solutions design and software development,
  platform implementation and software management (Microsoft Dynamics 365, Microsoft Fabric, Salesforce),
  and quality assurance. Alongside these services it packages six productised offerings — DataWorks 360,
  BI Xpert 360, AI Assist 360, Retail AI Insights 360, PBILens 360 and Smart IoT Data Track 360 — and
  publishes case studies across healthcare, manufacturing, retail/B2B, education, agriculture, clinical
  research, warehouse operations, the art industry and government. Customer Analytics is a professional
  services company: as of this enrichment pass it publishes no public developer portal, API documentation,
  SDKs or machine-readable API specifications.'
